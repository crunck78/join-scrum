@if (linkType === 'mat-raised-button') {
<a
	[hidden]="hidden"
	mat-raised-button
	color="primary"
	routerLinkActive="active-link"
	[routerLinkActiveOptions]="{exact: true}"
	[routerLink]="basePath ? [basePath, route?.path] : [route?.path]"
>
	@if (!content.children.length) {<div>{{ route?.title }}</div>}
	<div #content>
		<ng-content></ng-content>
	</div>
</a>
}
