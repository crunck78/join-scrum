<div
	[style.fontSize]="size"
	[style.borderColor]="borderColor"
	[style.backgroundColor]="backgroundColor"
	class="host-container"
>
	@if (imgSrc) {
	<img
		class="person-img"
		[src]="imgSrc || 'assets/person.svg'"
		alt="{{contactName ? contactName : 'Person'}} image"
	>
	} @else {
	{{ contactInitials }}}
</div>
