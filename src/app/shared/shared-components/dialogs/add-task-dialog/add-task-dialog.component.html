<app-dialog [title]="title">
	<ng-container side></ng-container>

	<app-add-task
		(deletedTask$)="handleActionTaskForm($event)"
		(addedTask$)="handleActionTaskForm($event)"
		(editedTask$)="handleActionTaskForm($event)"
		[predefinedTaskRequest]="predefinedTaskRequest"
		(formStatus$)="updateFormStatus($event)"
		[deleteTask$]="deleteTask$"
		[clearTaskForm$]="clearTaskForm$"
		[submitTaskForm$]="submitTaskForm$"
		[hideFooter]="true"
		[mode]="mode"
		[task]="task"
	></app-add-task>

	<div class="footer" actions>
		<div class="simple-grid">
			@if (mode === 'edit') {
			<button aria-label="Delete Task" (click)="deleteTask$.emit()" color="warn" mat-stroked-button>
				Delete
			</button>
			}
			<button
				aria-label="Clear Task Form"
				(click)="clearTaskForm$.emit()"
				mat-stroked-button
				color="primary"
			>
				Clear
			</button>
			<button
				aria-label="Submit Task Form"
				[disabled]="formStatus && formStatus !== 'VALID'"
				(click)="submitTaskForm$.emit()"
				mat-raised-button
				color="primary"
			>
				@if (mode === 'add') {<span>Create Task</span>} @if (mode === 'edit') {
				<span>Save Task</span>}
			</button>
		</div>
	</div>
</app-dialog>
