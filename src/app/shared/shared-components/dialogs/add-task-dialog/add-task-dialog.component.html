<app-dialog [title]="title">
	<ng-container side></ng-container>

	<app-add-task
		(deletedTaskId$)="handleDeletedTask($any($event))"
		(addedTask$)="handleAddedTask($any($event))"
		(editedTask$)="handleEditedTask($any($event))"
		[predefinedTaskRequest]="predefinedTaskRequest"
		(formStatus$)="updateFormStatus($event)"
		[showPageTitle]="false"
		[deleteTask$]="deleteTask"
		[clearTaskForm$]="clearTaskForm"
		[submitTaskForm$]="submitTaskForm"
		[hideFooter]="true"
		[mode]="mode"
		[task]="task"
	></app-add-task>

	<div class="footer" actions>
		<div class="simple-grid">
			@if (mode === 'edit') {
			<button (click)="deleteTask.emit()" color="warn" mat-stroked-button>
				Delete
			</button>
			}
			<button (click)="clearTaskForm.emit()" mat-stroked-button color="primary">
				Clear
			</button>
			<button
				[disabled]="formStatus && formStatus !== 'VALID'"
				(click)="submitTaskForm.emit()"
				mat-raised-button
				color="primary"
			>
				@if (mode === 'add') {<span>Create Task</span>} @if (mode === 'edit') {
				<span>Save Task</span>}
			</button>
		</div>
	</div>
</app-dialog>
