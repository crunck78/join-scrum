<app-dialog [title]="'Add Contact'">
	<ng-container side></ng-container>

	<form class="main-content" [formGroup]="addContactForm">
		<app-form-field
			[required]="false"
			[autocomplete]="'contact-name'"
			[type]="'text'"
			[inputType]="'input'"
			[suffixPath]="'assets/person.svg'"
			[control]="$any(addContactForm.get('name'))"
			[labelName]="'Name'"
		></app-form-field>

		<app-form-field
			[required]="false"
			[errors]="[{name: 'email', htmlMessage: 'Please enter a valid email address'}]"
			[autocomplete]="'contact-email'"
			[type]="'email'"
			[inputType]="'input'"
			[suffixPath]="'assets/mail.svg'"
			[control]="$any(addContactForm.get('email'))"
			[labelName]="'Email'"
		></app-form-field>

		<app-form-field
			[required]="false"
			[autocomplete]="'contact-phone'"
			[type]="'tel'"
			[inputType]="'input'"
			[suffixPath]="'assets/phone.svg'"
			[control]="$any(addContactForm.get('phoneNumber'))"
			[labelName]="'Phone'"
		></app-form-field>
	</form>

	<ng-container actions>
		<button mat-dialog-close mat-stroked-button color="primary">Cancel</button>
		<button
			(click)="addContact()"
			[disabled]="addContactForm.invalid"
			mat-raised-button
			color="primary"
			[ariaLabel]="'Create Contact'"
		>
			Create Contact
		</button>
	</ng-container>
</app-dialog>
