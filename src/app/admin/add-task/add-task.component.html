<app-card>
	<form class="main-content" [formGroup]="addTaskForm">
		<div class="form-field-group">
			<app-form-field
				[errors]="[
                {name: 'required', htmlMessage: 'Title is <strong>required</strong>'}
            ]"
				[autocomplete]="'task-title'"
				[type]="'text'"
				[inputType]="'input'"
				[labelName]="'Enter a Title'"
				[control]="$any(addTaskForm.get('title'))"
			></app-form-field>

			<app-form-field
				[errors]="[
            {name: 'required', htmlMessage: 'Category is <strong>required</strong>'}]"
				[suffixIcon]="'add'"
				(action)="
                addCategory()"
				[actionLabel]="'Add Category'"
				[options]="categories | options : 'name' : 'id'"
				[optionTemplate]="categoryTpl"
				[required]="true"
				[inputType]="'select'"
				[labelName]="'Select a category'"
				[control]="$any(addTaskForm.get('category'))"
			></app-form-field>

			<app-form-field
				[multiple]="true"
				[suffixIcon]="'add'"
				[actionLabel]="'Add Contact'"
				(action)="addContact()"
				[options]="contacts | options : 'name' : 'id'"
				[required]="false"
				[inputType]="'select'"
				[labelName]="'Select assignees'"
				[control]="$any(addTaskForm.get('assignees'))"
			></app-form-field>

			<app-form-field
				[required]="false"
				[autocomplete]="'task-description'"
				[type]="'text'"
				[inputType]="'text-area'"
				[labelName]="'Enter a Description'"
				[control]="$any(addTaskForm.get('description'))"
			></app-form-field>
		</div>

		<mat-divider [vertical]="true"></mat-divider>

		<div class="form-field-group">
			<app-form-field
				[errors]="[
                {name: 'required', htmlMessage: 'Date is <strong>required</strong>'}
            ]"
				[autocomplete]="'date-title'"
				[inputType]="'date'"
				[labelName]="'dd/mm/yyyy'"
				[control]="$any(addTaskForm.get('dueDate'))"
			></app-form-field>

			<app-form-field
				[errors]="[{name: 'required', htmlMessage: 'Priority is <strong>required</strong>'}]"
				[options]="[{name: 'Low'}, {name: 'Medium'}, {name: 'Urgent'}] | options : 'name' : 'name'"
				[optionTemplate]="priorityTpl"
				[required]="true"
				[inputType]="'select'"
				[labelName]="'Select a priority'"
				[control]="$any(addTaskForm.get('priority'))"
			></app-form-field>

			<app-form-field
				[required]="false"
				[suffixIcon]="'add'"
				(action)="addSubtask()"
				[actionLabel]="'Add Subtask'"
				[autocomplete]="'task-subtask'"
				[type]="'text'"
				[inputType]="'input'"
				[labelName]="'Add new subtask'"
				[control]="addSubtaskForm"
			></app-form-field>

			<div class="subtasks-list">
				@for (subtask of addTaskForm.get('subtasks')?.value; track subtask; let
				i = $index) {
				<app-subtask
					class="subtask"
					(removeSubtask$)="removeSubtask($event)"
					[subtask]="subtask"
				></app-subtask>
				}
			</div>
		</div>
	</form>
	@if (!hideFooter) {
	<div class="footer" footer>
		<div class="simple-grid">
			<button
				aria-label="Clear Task Form"
				(click)="resetAddTask()"
				mat-stroked-button
				color="primary"
			>
				Clear
			</button>
			<button
				[disabled]="addTaskForm.invalid"
				(click)="saveTask()"
				mat-raised-button
				aria-label="Save Task"
				color="primary"
			>
				@if (mode === 'add') {<span>Create Task</span>} @if (mode === 'edit') {
				<span>Save Task</span>}
			</button>
		</div>
	</div>
	}
</app-card>

<ng-template #priorityTpl let-item>
	<span class="priority-option">
		<span>{{ item.name | uppercase }}</span>
		<img
			class="priority-icon"
			src="assets/{{ item.name | lowercase }}.svg"
			alt=""
		>
	</span>
</ng-template>

<ng-template #categoryTpl let-item>
	<span class="category-option">
		<span
			class="category-color"
			style="background-color: {{item.color}}"
		></span>
		<span class="category-name">${{ item.name }}</span>
	</span>
</ng-template>
